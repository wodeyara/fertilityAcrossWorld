name: Deploy web app to GitHub Pages

# Builds web/ and publishes it to GitHub Pages on every push to main.
# One-time setup by the repo owner: Settings → Pages → Build and deployment →
# Source: "GitHub Actions". No secrets required.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Derive the Pages base path from the repo name so a project site served at
      # https://<owner>.github.io/<repo>/ resolves assets and /data correctly.
      # (For a user/org site named <owner>.github.io, this yields the correct root.)
      - name: Build
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ "$REPO" = "${GITHUB_REPOSITORY_OWNER}.github.io" ]; then
            export VITE_BASE="/"
          else
            export VITE_BASE="/$REPO/"
          fi
          echo "Building with VITE_BASE=$VITE_BASE"
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
