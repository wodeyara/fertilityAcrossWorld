<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Fertility explorer">
  <!-- dark rounded tile so the mark stands out on both light and dark tab bars -->
  <rect width="32" height="32" rx="7" fill="#0f172a"/>
  <!-- globe split into the diverging residual colours: blue (lower than predicted) / red (higher) -->
  <clipPath id="g"><circle cx="16" cy="16" r="10"/></clipPath>
  <g clip-path="url(#g)">
    <rect x="5" y="5" width="11" height="22" fill="#2166ac"/>
    <rect x="16" y="5" width="11" height="22" fill="#b2182b"/>
    <!-- faint meridian + equator to read as a globe -->
    <g fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.1">
      <ellipse cx="16" cy="16" rx="4.6" ry="10"/>
      <line x1="6" y1="16" x2="26" y2="16"/>
    </g>
  </g>
  <circle cx="16" cy="16" r="10" fill="none" stroke="#ffffff" stroke-width="1.6"/>
</svg>
